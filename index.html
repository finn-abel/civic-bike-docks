<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bike Share Toronto — Dock Map</title>
    <meta
      name="description"
      content="Every Bike Share Toronto dock, mapped from the City of Toronto GBFS feed."
    />
  </head>

  <body>
    <main>
      <div id="map" role="application" aria-label="Map of Bike Share Toronto docks"></div>

      <!-- Deliberately outside the rail: the rail is hidden until the camera
           lands, and the theme should be changeable from the first screen. -->
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
        ☾
      </button>

      <!-- The opening screen. Removed from the DOM once the camera lands, so it
           cannot sit invisibly over the map catching clicks. -->
      <section id="landing" class="landing" aria-label="Introduction">
        <div class="landing__copy">
          <p class="landing__eyebrow">Bike Share Toronto</p>
          <h1 class="landing__title">Every dock in the city</h1>
          <p class="landing__lede">
            All 1,063 public bike docks, at their real coordinates, with how many
            bikes are waiting at each one right now.
          </p>
          <button id="start" class="landing__cta" type="button">
            Get started
            <span class="landing__cta-arrow" aria-hidden="true">→</span>
          </button>
          <p class="landing__meta">
            <span class="stamp">Measured</span>
            City of Toronto GBFS feed
          </p>
        </div>
      </section>

      <!-- One left rail, so page chrome occupies a single column and covers as
           little of the city as possible. -->
      <div class="rail">
        <header class="masthead">
          <p class="masthead__eyebrow">Bike Share Toronto</p>
          <p class="masthead__title">Every dock in the city</p>
          <p class="masthead__source">
            <span class="stamp">Measured</span>
            City of Toronto GBFS feed
          </p>
          <!-- Written by showFreshness() in src/map.ts. -->
          <p class="freshness"><span id="freshness">Loading…</span></p>
        </header>

        <!-- Written by renderPanel() in src/panel.ts. -->
        <section
          id="station-panel"
          class="panel"
          aria-label="Station details"
          aria-live="polite"
          hidden
        ></section>

        <section class="controls" aria-label="Coverage">
          <fieldset class="intent">
            <legend class="intent__legend">I want to</legend>
            <div class="intent__options">
              <label class="intent__option">
                <input type="radio" name="intent" value="borrow" checked />
                <span>Get a bike</span>
              </label>
              <label class="intent__option">
                <input type="radio" name="intent" value="return" />
                <span>Return one</span>
              </label>
              <label class="intent__option">
                <input type="radio" name="intent" value="none" />
                <span>Neither</span>
              </label>
            </div>
          </fieldset>

          <!-- Written by setCoverageReadout() in src/controls.ts. -->
          <p class="gap" id="gap-readout"></p>
          <p class="gap__detail" id="gap-detail"></p>

          <figure class="legend">
            <figcaption class="legend__title" id="legend-title">Bikes available</figcaption>
            <div class="legend__ramp" aria-hidden="true">
              <span style="--swatch: #d2551f"></span>
              <span style="--swatch: #96380f"></span>
              <span style="--swatch: #5c200a"></span>
            </div>
            <p class="legend__ends">
              <span id="legend-low">None</span><span id="legend-high">Full</span>
            </p>
            <p class="legend__note">
              <span class="legend__hollow" aria-hidden="true"></span>
              No availability data
            </p>
            <p class="legend__note" id="legend-wash">
              <span class="legend__wash" aria-hidden="true"></span>
              Within a 400 m walk
            </p>
            <p class="legend__note legend__note--muted">
              Dot size is dock capacity. Numbered circles group nearby stations —
              click one to zoom in.
            </p>
          </figure>
        </section>
      </div>

      <!-- Message is written by showFailure() in src/map.ts. -->
      <p id="map-error" class="notice" role="status" hidden></p>
    </main>

    <script type="module" src="/src/map.ts"></script>
  </body>
</html>
